server:
  port: ${SERVER_PORT:8088}

spring:
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/knowledge_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD}"
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: "${JWT_SECRET}"
  expiration: ${JWT_EXPIRATION:86400000}

app:
  initializer:
    admin-username: "${INITIAL_ADMIN_USERNAME:admin}"
    admin-password: "${INITIAL_ADMIN_PASSWORD:}"
    admin-nickname: "${INITIAL_ADMIN_NICKNAME:管理员}"
